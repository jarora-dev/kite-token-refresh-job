# cloudbuild.yaml ─ CI/CD for token‑refresher
substitutions:
  _REGION: asia-south1
  _REPOSITORY: kite-token-refresh-job
  _IMAGE_NAME: token-refresher
  _PROJECT_ID: zerodha-algo-trading-297611

steps:
  # ── 1. build & tag image ───────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA"
      - "."

  # ── 2. push both tags (immutable SHA + latest) ─────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-latest
    args:
      - push
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest"

  - name: gcr.io/cloud-builders/docker
    id: push-sha
    args:
      - push
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA"

  # ── 3. deploy new revision of the Cloud Run Job ────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud beta run jobs deploy kite-token-job \
          --region=${_REGION} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA \
          --task-timeout=15m \
          --tasks=1 --max-retries=1 \
          --cpu=1 --memory=512Mi \
          --service-account=trading-sa@$PROJECT_ID.iam.gserviceaccount.com \
          --set-secrets=KITE_API_KEY=projects/$PROJECT_ID/secrets/kite_api_key:latest:env,\
          KITE_API_SECRET=projects/$PROJECT_ID/secrets/kite_api_secret:latest:env,\
          KITE_USER_ID=projects/$PROJECT_ID/secrets/kite_user_id:latest:env,\
          KITE_PASSWORD=projects/$PROJECT_ID/secrets/kite_password:latest:env,\
          KITE_TOTP_SECRET=projects/$PROJECT_ID/secrets/kite_totp_secret:latest:env,\
          ACCESS_SECRET_NAME=projects/$PROJECT_ID/secrets/kite_access_token:latest:env \
          --quiet

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA"
